name: Update podcast episodes

on:
  schedule:
    # Episodes publish Tue/Thu ~03:30 UTC — fetch a bit later the same morning
    - cron: '0 5 * * 2,4'
  workflow_dispatch:        # manual "Run workflow" button in the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild episodes.js from RSS
        working-directory: podcast
        run: python build_episodes.py

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add podcast/episodes.js
          if git diff --cached --quiet; then
            echo "No new episodes."
          else
            git commit -m "podcast: auto-update episodes from RSS"
            git push
          fi
